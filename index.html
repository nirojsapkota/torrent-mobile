<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>uTorrent Mobile</title>
    <!-- Chrome, Firefox OS and Opera theme color -->
    <meta name="theme-color" content="#10b981" />
    <!-- Apple Mobile Web App specifics -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="uTorrent" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#090d16] text-white overflow-x-hidden select-none touch-pan-y">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('uTorrent Service Worker registered successfully:', reg.scope))
            .catch(err => console.log('uTorrent Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
